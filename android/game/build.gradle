plugins {
    id 'com.android.application' version '8.7.3'
}

def source = rootProject.file('..')
if (!new File(source, 'src/port/tools/play.cpp').isFile()) {
    source = rootProject.file('../upstream/hotd2-re')
}
def sdl = rootProject.file('../.work/deps/SDL3-3.4.18')
// Pre-downloaded by scripts/build_android.ps1; otherwise CMake fetches the pinned archives.
def adrenotools = rootProject.file('../.work/deps/libadrenotools-8fae8ce254dfc1344527e05301e43f37dea2df80')
def linkernsbypass = rootProject.file('../.work/deps/liblinkernsbypass-aa3975893d83ef1bc84c321ec60c65fbf1287887')
// -Photd2Abi=armeabi-v7a builds the experimental 32-bit APK; custom Vulkan drivers are 64-bit only.
def abi = providers.gradleProperty('hotd2Abi').getOrElse('arm64-v8a')
def customDrivers = abi == 'arm64-v8a'
def nativeArguments = ["-DFETCHCONTENT_SOURCE_DIR_SDL3=${sdl.absolutePath}", '-DANDROID_STL=c++_static']
if (new File(adrenotools, 'src/driver.cpp').isFile() && new File(linkernsbypass, 'android_linker_ns.cpp').isFile()) {
    nativeArguments += ["-DFETCHCONTENT_SOURCE_DIR_ADRENOTOOLS=${adrenotools.absolutePath}",
                        "-DFETCHCONTENT_SOURCE_DIR_LINKERNSBYPASS=${linkernsbypass.absolutePath}"]
}
def portAssets = layout.buildDirectory.dir('generated/portAssets')
def preparePortAssets = tasks.register('preparePortAssets', Copy) {
    into(portAssets)
    from(new File(source, 'scenes/st1_play.scene')) {
        into('scenes')
    }
    from(new File(source, 'LICENSE')) {
        rename { 'LICENSE-HOTD2RE.txt' }
    }
    from(new File(source, 'THIRD_PARTY_NOTICES.txt'))
    from(new File(sdl, 'LICENSE.txt')) {
        rename { 'LICENSE-SDL.txt' }
    }
}

android {
    namespace 'com.codepdbh.hotd2evolved'
    compileSdk 35
    ndkVersion '28.2.13676358'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId providers.gradleProperty('hotd2ApplicationId').getOrElse(namespace)
        minSdk 29
        targetSdk 35
        versionCode 4
        versionName '1.2'

        ndk {
            abiFilters abi
        }
        externalNativeBuild {
            cmake {
                arguments(*nativeArguments)
                // main_hook and hook_impl load custom Vulkan drivers; the shim hands them to SDL.
                if (customDrivers) {
                    targets 'hotd2_android', 'SDL3-shared', 'main_hook', 'hook_impl', 'hotd2_vulkan_shim'
                } else {
                    targets 'hotd2_android', 'SDL3-shared'
                }
            }
        }
    }

    buildTypes {
        debug {
            externalNativeBuild {
                cmake {
                    // The APK is debuggable, but frame performance needs an optimized engine.
                    arguments '-DCMAKE_BUILD_TYPE=RelWithDebInfo'
                }
            }
        }
        release {
            externalNativeBuild {
                cmake {
                    arguments '-DCMAKE_BUILD_TYPE=Release'
                }
            }
        }
    }

    packaging {
        jniLibs {
            // libadrenotools loads its hooks from nativeLibraryDir, so the libraries must be extracted.
            useLegacyPackaging true
        }
    }

    sourceSets.main {
        java.srcDir(new File(sdl, 'android-project/app/src/main/java'))
        assets.srcDir(portAssets)
    }

    externalNativeBuild {
        cmake {
            path new File(source, 'CMakeLists.txt')
            version '3.30.5'
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn(preparePortAssets)
}
